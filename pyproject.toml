[build-system]
requires = ["setuptools>=69.0.3", "wheel"] 
build-backend = "setuptools.build_meta"

[project]
name = "wass2s"
version = "0.4.10.1"
description = "A Python package for seasonal climate forecast."
readme = "README.md"
authors = [
    {name = "HOUNGNIBO C. M. Mandela", email = "hmandelahmadiba@gmail.com"},
]
license = "GPL-3.0-or-later"
keywords = [
    "climate",
    "seasonal forecasting",
    "subseasonal forecasting",
    "machine learning",
    "data downloading",
    "downscaling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

requires-python = ">=3.11"
dependencies = [
    "statsmodels",
    "scipy==1.11.3",
    "matplotlib==3.7.3",
    "xeofs==3.0.4",
    "cdsapi==0.7.4",
    "cartopy==0.25.*",
    "rasterio",
    "geopandas",
    "shapely",
    "rioxarray",
    "SkillMetrics",
    "optuna",
    "earthkit",
    "ipywidgets",
    "regionmask",
    "pycountry",
    "cca-zoo",
    "eccodes",
    "cfgrib"
    # "torch",
    # "lightning",
    # "cca-zoo"
]

[project.urls]
Homepage = "https://pypi.org/project/wass2s/"
Documentation = "https://wass2s-readthedocs.readthedocs.io/en/latest/"
Repository = "https://github.com/hmandela/WASS2S/tree/main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pixi.workspace]
channels = ["conda-forge", "hallkjc01"]
platforms = ["linux-64", "win-64", "osx-64"]

[tool.pixi.pypi-dependencies]
wass2s = { path = ".", editable = true }
hpelm = "==1.0.10"
fitter = "==1.7.1"
minisom = "==2.3.5"

# Core dependencies

[tool.pixi.dependencies]
python = "3.11.*"
pip = "*"
numpy = "1.26.*"
scipy = "1.11.3.*"
pandas = "2.2.*"
scikit-learn = "1.5.*"
numba = ">=0.59,<0.61"
llvmlite = ">=0.43,<0.44"
statsmodels = "0.14.*"
openblas = "*"

# file io, compression and parallel computing
dask = ">=2025.1.0"
distributed = ">=2025.1.0"
h5py = "*"
h5netcdf = "*"
netcdf4 = "*"
xarray = ">=2024.6,<2025.1.0"
cf_xarray = "*"
cfgrib = "*"
eccodes = "*"
zarr = "*"
blosc = "*"
bottleneck = "*"
sparse = "*"
tqdm = "*"

# spatial dependencies
gdal = "3.9.*"
pyproj = "*"
pykrige = "*"
cartopy = "0.25.*"

# dataviz libraries
matplotlib = "3.7.3.*"
seaborn = "*"
bokeh = "*"
folium = "*"
xhistogram = "*"

# Prob libraries
pymc = "5.22.*"
arviz = "0.21.*"
pytensor = "*"

# Weather and climate libraries
cdsapi = "0.7.4.*"
cftime = "*"
udunits2 = "*"

# utilities & notebooks
ipython = "*"
ipykernel = "*"
jupyterlab = "*"
jupyterlab_widgets = "*"
widgetsnbextension = "*"
black = "*"
rich = "*"
click = "*"
requests = "*"
joblib = "*"
pyyaml = "*"

# xcast
xcast = "*"

# linux-64 / osx-64 only

[tool.pixi.target.unix.dependencies]
proj = "*"
geos = "*"
shapely = "*"
geopandas = "*"
rasterio = "*"
rioxarray = "*"
regionmask = "*"
pycountry = "*"
xesmf = "*"
esmpy = "*"
cdo = "*"
python-cdo = "*"
xgboost = "2.1.*"
lightgbm = "4.6.*"
properscoring = "*"
xskillscore = "0.0.26.*"

[tool.pixi.target.linux-64.pypi-dependencies]
ibicus = "==1.1.3"

# win-64

[tool.pixi.target.win-64.pypi-dependencies]
properscoring = "*"
xgboost = "==2.1.*"
lightgbm = "==4.6.0"
xskillscore = "==0.0.26"

# --- Docs website (quartodoc generates reference/*.qmd; render with a
# system-installed `quarto` CLI — see https://quarto.org/docs/get-started/.
# The conda-forge `quarto` package's bundled dart-sass fails to compile
# themes on at least some machines, so it's deliberately not pixi-managed. ---
[tool.pixi.feature.docs.dependencies]
quartodoc = "*"
griffe = "1.14.*"

[tool.pixi.feature.docs.tasks]
docs-build = "quartodoc build"
docs-render = { cmd = "quarto render", depends-on = ["docs-build"] }
docs-preview = { cmd = "quarto preview", depends-on = ["docs-build"] }

[tool.pixi.environments]
default = { solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

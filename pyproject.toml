[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wass2s"
version = "0.5.0"
description = "wass2s: A python-based tool for seasonal agro-hydro-climatic forecasts"  
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "HOUNGNIBO C. M. Mandela", email = "hmandelahmadiba@gmail.com"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt", "COPYING_TELNET_GPL3.txt", "THIRD_PARTY_RISE.md"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "packaging>=23",
    "numpy>=1.26",
    "pandas>=2.0",
    "xarray>=2024.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "threadpoolctl>=3.1",
    "python-dateutil>=2.8.2",
    "bottleneck>=1.5",
    "cca-zoo>=3.1,<4",
    "matplotlib>=3.8",
    "cartopy>=0.22",
    "rioxarray>=0.15",
    "rasterio>=1.3",
    "dask[array,distributed]>=2024.1",
    "netCDF4>=1.6",
    "cftime>=1.6.4",
    "h5netcdf>=1.3",
    "h5py>=3.10",
    "numba>=0.59",
    "xeofs>=3.0,<4",
    "fitter>=1.7",
    "tqdm>=4.66",
    "requests>=2.31",
    "urllib3>=2.0",
    "cdsapi>=0.7.7",
    "cfgrib>=0.9.10",
    "eccodes>=1.6",
    "optuna>=3.6",
    "properscoring>=0.1",
    "xskillscore>=0.0.26",
    "statsmodels>=0.14",
    "minisom>=2.3",
    "seaborn>=0.13",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "torch>=2.2",
    "pykrige>=1.7",
    "SkillMetrics>=1.2",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "regionmask>=0.12",
    "networkx>=3.0",
    "PyYAML>=6.0",
    # Required by was_seasonal_analysis with the direct public imports.
    "earthkit-data>=0.10",
    "ipywidgets>=8.0",
    "ipython>=8.0",
]

[project.urls]
Homepage = "https://pypi.org/project/wass2s/"
Documentation = "https://wass2s-readthedocs.readthedocs.io/en/latest/"
Repository = "https://github.com/hmandela/WASS2S"

[project.optional-dependencies]
# Historical extra names remain valid; their requirements are now in the base.
science = []
geo = []
hydro = []
ml = []
kernel = []
neural = []
cli = []

# Full BMA / MCMC; keep the PyMC 5 and ArviZ 0.x API used by this release.
bayes = ["pymc>=5.0,<6", "arviz>=0.22,<1"]
# Applications for running notebooks; imported notebook helpers are in the base.
notebooks = ["jupyterlab>=4", "ipykernel>=6"]
sftp = ["paramiko>=3.0"]
dev = ["pytest>=8.0", "build>=1.2", "wheel>=0.43"]

# Additional runtime features. Development tools have their own extra.
all = [
    "pymc>=5.0,<6", "arviz>=0.22,<1",
    "jupyterlab>=4", "ipykernel>=6",
    "paramiko>=3.0",
]

[tool.setuptools]
script-files = [
    "Cli_PRCP_WA_scientific_v8_clean_numba_010926.py",
    "Cli_TEMP_WA_scientific_v8_clean_numba_010926.py",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wass2s", "wass2s.*"]

[tool.setuptools.package-data]
wass2s = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
